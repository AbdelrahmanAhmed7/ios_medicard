name: medicard
description: "MediCard - Your digital medical card for managing health insurance and medical services."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  json_annotation: ^4.12.0
  retrofit: ^4.9.2
  freezed_annotation: ^3.1.0
  flutter_screenutil: ^5.9.3
  go_router: ^17.3.0
  flutter_bloc: ^9.1.1
  easy_localization: ^3.0.8
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2
  dio: ^5.9.2
  http: ^1.6.0
  http_parser: ^4.0.2
  dartz: ^0.10.1
  equatable: ^2.0.7
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  get_it: ^9.2.1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: 7.0.0
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.3
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.8.3
  permission_handler: ^12.0.3
  fluttertoast: ^9.1.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.1
  firebase_core: ^4.10.0
  smooth_page_indicator: ^2.0.1
  geocoding: ^4.0.0
  flutter_html: ^3.0.0
  mockito: ^5.7.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  video_player: ^2.13.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable:
  freezed:
  build_runner:
  retrofit_generator:
  flutter_launcher_icons: ^0.14.3
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/signup/
    - assets/home/
    - assets/translations/
    - assets/onboarding/
    - assets/splash/
    - assets/promotions/
    - assets/ecard/
    - assets/medi_logo.png
    - assets/Khusm Logo.png

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

